    eoc: ['#CNC', '#Machining', '#Collets']
    tapping: ['#CNC', '#Machining', '#Tapping']
    nut: ['#CNC', '#Machining', '#Collets']
    adapter: ['#Machining', '#MetalWorking', '#Collets']
    deep groove: ['#Bearings', '#PowerTransmission', '#Maintenance']
    tapered roller: ['#Bearings', '#PowerTransmission', '#Maintenance']
    spherical roller: ['#Bearings', '#Mining', '#Maintenance']
    cylindrical roller: ['#Bearings', '#PowerTransmission', '#Maintenance']
    y-bearing: ['#Bearings', '#PowerTransmission', '#Maintenance']
    needle: ['#Bearings', '#PowerTransmission', '#Maintenance']
