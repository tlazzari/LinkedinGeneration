  image_prompt: >
    Clean industrial macro photography of the one product the post is about, on a machined steel
    surface — a toolholder, collet, hydraulic chuck or tapping collet, or a ball, tapered, spherical,
    cylindrical, Y or needle roller bearing — under dramatic directional lighting that reveals the
    ground surfaces. No text, no logos, no labels anywhere in the image.
- name: 'Workholding Precision: Collets, Pull Studs & Morse Tapers'
  # These proof points are catalogue specifications and published standards - ER
  # runout grades, DIN69872, ISO 7388/2B, Si3N4 ball density. They are checkable
  # facts about what TNT sells, not stories about what TNT did, so a post MAY
  # cite them and quote their figures. The four story pillars are the opposite
  # and steer only; see the note on angle material in content_generation.
  proof_points_are_specs: true
  use_news_search: true
  news_queries:
  - machine tool workholding industry
  - CNC machining industry news
  - toolholding spindle technology
  - 机床 行业
  target_client: >
    CNC machining centre operators, toolroom managers, spindle repair technicians, and
    OEM machine-tool manufacturers who specify the interface between spindle and cutting
    tool — where every micron of runout costs them surface finish, tool life, and cycle time.
  angle: >
    Expose the workholding stack: the three components between spindle and cutting edge —
    the pull stud that locks into the drawbar, the collet that grips the tool shank, and
    the Morse taper that centres it all. Each post zooms into one component. Use the tolerances
    and standards in the proof points below (a runout figure always with where it is measured, e.g.
    "at 4×D"), failure modes, and application pairings. Open with
    the consequence of getting it wrong, described as a mechanism (what slips, what wears, what
    it does to the finish) - never an invented figure. Make engineers feel the engineering.
  proof_points:
  # AUDITED 2026-09-29: removed unsourced figures (±0.003 HP, 12,000 rpm, "up to 30%", 2 mm,
  # 40–60°C, 2–3x) and the invented "we see this every month in returns".
  - 'ER collet series (ER8–ER50, DIN 6499 / ISO 15488): runout ≤ 0.008 mm standard grade and ≤ 0.005 mm
    HP grade, both measured at 4×D (CNC Tooling Catalogue) — the difference that separates finishing
    passes from rework'
  - 'Pull studs (拉钉) — DIN 69872, ISO 7388/2B, MAS 403 BT, JIS B 6339: the one component most
    machinists never inspect. A worn or mismatched stud weakens the drawbar grip on the holder, causing
    micro-slip at the spindle taper and damaging both the stud and the holder. TNT pull studs are
    case-hardened to HRC 58 ± 2 with thread runout ≤ 0.005 mm to ISO 7388-3. ISO30 and BT30 share the
    7/24 taper but are NOT interchangeable: different flange, flats versus drive notches'
  - 'Morse taper with tang (MT1–MT6, with drive key): positive rotational lock for drilling and
    boring on non-powered quills — tang transfers torque, taper centres. Critical: tang must be
    intact and the drift-slot geometry matched to the machine; a chipped tang causes eccentric thrust'
  - 'Morse taper without tang (plain taper): friction-only drive — correct for powered spindles
    where the taper is held in compression. Fitted with a drawbar bolt through the shank. Zero
    tang wear, but requires correct drawbar tension: under-tension causes taper fretting, over-tension
    cracks the quill'
  - 'Internal coolant collets (ERC series, sealed for through-tool coolant up to 120 bar): the coolant
    goes through the tool to the cutting edge instead of around it — the choice for deep holes and for
    materials that work-harden, such as stainless steel and titanium'
  - 'Collet sets (ER8 to ER50): match the collet series to the chuck and to the shank diameter. Each ER
    collet closes over a small range (1 mm on most sizes, 0.5 mm on the smallest), so a set is chosen
    to cover every shank in the range you run'
  ctas:
  - What collet series runs in your machining centre? Tell us the rpm and we will spec the right grade
  - Suspecting spindle runout? The pull stud is the first thing to check — DM us
  - Tag a toolroom engineer who specifies their own workholding
  hashtags:
  - '#CNC'
  - '#Machining'
  - '#Toolholding'
  image_prompt: >
    Macro studio photography of CNC workholding components arranged on a precision granite surface:
    an ER collet open and closed, a pull stud showing the threaded shank, and a Morse taper with
    visible tang drive slot — dramatic raking side-light that catches every machined surface and
    thread, deep shadow background, no text, no labels, hyper-real metallic texture.
