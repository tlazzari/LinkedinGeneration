defaults:
  tone: 'Energetic, human-centred storytelling that reveals TNT Motion engineers in action.

    Blend approachable language with deep technical insight. Each post should feel like a

    conversation on the shop floor or in the lab, never a corporate boilerplate.

    Celebrate hands-on expertise in lubrication design, precision assembly, and demanding

    applications such as compressors, pumps, turbocompressors, CNC machining, robotics, and

    future-ready bearing innovations.

    '
  # Brand tag first - it is always kept. max_hashtags caps the whole block (2026-09-29).
  hashtags:
  - '#TNTMotion'
  - '#Manufacturing'
  - '#Engineering'
  max_hashtags: 4
schedule:
  timezone: Europe/Rome
  slots:
  - day: Tuesday
    time: 09:00
  - day: Thursday
    time: 09:00
image_provider:
  provider: google-imagen
  model: gemini-3.1-flash-image
  size: 1024x1024
  style_hint: High-end industrial photography with cinematic lighting and rich metallic textures. No text, no logos, no branding.
  use_animated_gif: true
  gif_num_frames: 6
  gif_frame_duration: 1000
  curated_library:
  - url: https://images.unsplash.com/photo-1581091226825-a6a2a5aee158
    alt_text: Technician adjusting bearings inside a CNC machine
  - url: https://images.unsplash.com/photo-1517430816045-df4b7de11d1d
    alt_text: Close-up of industrial bearings lined on a production table
content_pillars:
- name: 'Myth Busters: Bearing Secrets They Never Told You'
  # Evergreen by nature: a technical misconception is timeless; no news makes it truer.
  # Search phrases kept so this can be flipped back deliberately.
  use_news_search: false
  news_queries:
  - bearing manufacturer industry
  - bearing technology development
  - 轴承 行业
  target_client: 'Maintenance engineers, purchasing managers, and plant operators who make daily decisions

    about bearing selection and care based on outdated assumptions or vendor marketing.

    '
  # 2026-09-17: this angle asked for the invention it got. Rewritten to
  # request the mechanism, never a narrative or a figure we cannot show.
  angle: 'Take one widely held belief about bearings and test it against how the parts actually behave. State the belief plainly, then explain the physics that contradicts it - what the material, the lubricant or the load is really doing. Do NOT open with an invented statistic such as "90% of engineers get this wrong", do NOT cite research you cannot name, and quote no figure unless it is a published standard or the post shows the arithmetic. The correction should be interesting because it is true, not because it is dramatic.'
  proof_points:
  - 'Myth: sealed bearings never need maintenance. Reality: grease ages faster as temperature rises, and a sealed unit cannot be re-greased when it does'
  - 'Why the old grease-quantity rule of thumb over-fills a modern high-speed spindle, and what churning does to running temperature'
  - 'Myth: the cheapest bearing saves money. Reality: replacement interval and downtime dominate the cost of a bearing, not its purchase price'
  - 'Myth: ceramic hybrids are only for aerospace. Reality: lower ball density reduces centrifugal load at high rpm, which is an ordinary CNC spindle problem'
  - 'Myth: alignment within a few hundredths is good enough. Reality: misalignment concentrates load on one edge of the raceway, and edge loading is what ends bearing life'
  - 'Myth: grease colour indicates quality. Reality: colour is a dye choice - base oil viscosity, thickener type and additive package decide life'
  ctas:
  - Which bearing myth has cost you the most? Drop it in the comments
  - DM us your toughest bearing question - we will myth-bust it live
  hashtags:
  - '#Bearings'
  - '#Maintenance'
  - '#ReliabilityEngineering'
  image_prompt: 'Dramatic close-up of a failed bearing cut in half showing internal damage, forensic

    lighting style, metallic textures with visible wear patterns, industrial laboratory setting.

    '
- name: 'When Bearings Fail: Forensic Stories from the Field'
  # Evergreen by nature: a forensic case study stands on its own evidence.
  # Search phrases kept so this can be flipped back deliberately.
  use_news_search: false
  news_queries:
  - bearing failure maintenance industry
  - predictive maintenance rotating equipment
  - equipment downtime manufacturing
  target_client: 'Reliability engineers, maintenance supervisors, and operations managers who deal with

    unexpected equipment failures and need to prevent recurrence.

    '
  # 2026-09-17: this angle asked for the invention it got. Rewritten to
  # request the mechanism, never a narrative or a figure we cannot show.
  angle: 'Explain one failure mode from the inside: the conditions that cause it, how it progresses, what it looks like at teardown, and what prevents it. Write it GENERICALLY - a mechanism that applies to anyone running that equipment. Do NOT invent a customer, a site, a call at 3 AM or an outcome, and attach no figure - temperature, clearance, downtime hours, euros - unless it comes from a published standard or the post shows how it was derived. Where a real limit matters, name the STANDARD.'
  proof_points:
  - 'Conveyor drives in washdown areas: how water passes a worn lip seal, what corrosion does to the raceway, and why the seizure arrives without warning'
  - 'Crusher bearings in abrasive slurry: how contamination bypasses a labyrinth seal, and why the replacement interval keeps shortening'
  - 'Vibration signatures of a developing inner-race spall: what the spectrum shows before failure, and how far ahead it can be read'
  - 'Running hotter than spec: how incorrect grease viscosity leads to micro-pitting, and what the teardown reveals'
  - 'Axial thrust from thermal expansion in compressor trains: why a bearing trips on overload when nothing else has changed'
  - 'White-etching cracks in gearbox bearings: what hydrogen embrittlement from lubricant breakdown does to a raceway'
  ctas:
  - Got a mystery failure you never solved? Share it - let us investigate together
  - Tag a colleague who would appreciate this forensic breakdown
  hashtags:
  - '#Bearings'
  - '#FailureAnalysis'
  - '#ReliabilityEngineering'
  image_prompt: 'Engineer with magnifying glass examining damaged bearing under bright forensic lighting,

    data charts and vibration graphs visible on screen in background, industrial diagnostic setting.

    '
- name: 'Extreme Applications: Bearings at the Limit'
  # Evergreen by nature: an application story is evergreen engineering, not an event.
  # Search phrases kept so this can be flipped back deliberately.
  use_news_search: false
  news_queries:
  - high temperature bearing application
  - wind turbine bearing
  - heavy industry equipment reliability
  target_client: 'OEM design engineers, R&D teams, and technical directors working on high-performance

    machinery in demanding environments - from Arctic installations to cleanroom robotics.

    '
  # 2026-09-17: this angle used to ask for "real performance numbers" and for the
  # reader to think "I did not know bearings could do that". It got them - a post
  # claiming TNT engineers developed a cleanroom solution that "stops particle
  # generation completely" and extends uptime "by 3x". None of it is backed by
  # anything. A pillar that asks for specifics nobody holds will be answered with
  # invented ones, and no downstream gate can fix a prompt that demands fiction.
  # Same correction already applied to the failure pillars: describe the
  # MECHANISM, claim no project as ours.
  angle: 'Explain how bearings survive one demanding condition - heat, cold, speed,

    vacuum, washdown or contamination. Start from the physics: what the condition does

    to a bearing, why a standard one fails there, and which design choices answer it

    (cage material, lubricant type, clearance class, sealing, coatings).

    Describe this GENERICALLY, as engineering that applies to anyone facing the

    condition. Do NOT narrate a specific project, customer or site as ours, and do

    NOT attach a performance figure - no hours, temperatures, multipliers or

    percentages - unless it is a published standard or a figure whose arithmetic

    the post shows. Where a real limit is worth naming, name the STANDARD (ISO

    class, DIN grade) rather than a result we claim to have achieved.

    '
  proof_points:
  - 'Turbocompressor bearings in continuous high-temperature service: why standard grease carbonises, and which cage materials survive'
  - 'Ceramic hybrids in very high-speed spindles: lower ball density, less centrifugal load, and where the benefit stops'
  - 'Cold-weather bearings in sub-zero service: grease stiffening, starting torque, and how clearance class is chosen'
  - 'Subsea and high-pressure service: what deep-water pressure does to a seal, and the trade-off between sealing and friction'
  - 'Cleanroom robotics: why standard grease sheds particles, and what polymer cages and dry-film lubricants change (ISO 14644 class terms)'
  - 'Reheat furnace bearings under radiant heat and spray cooling: thermal cycling, clearance growth, and solid lubricants'
  ctas:
  - What is the most extreme environment your bearings operate in?
  - Designing something demanding? Let us engineer the bearing solution together
  hashtags:
  - '#Bearings'
  - '#HeavyIndustry'
  - '#ReliabilityEngineering'
  image_prompt: 'Dramatic industrial scene showing machinery in extreme environment - either frozen

    industrial setting with ice crystals, or high-tech cleanroom with robotic arms,

    emphasizing harsh conditions and precision equipment.

    '
- name: 'Inside the Factory: Stories from Our Engineers'
  use_news_search: true
  news_queries:
  - precision manufacturing China factory
  - 机械制造 工厂 产能
  - manufacturing quality control industry
  target_client: 'Technical decision-makers who want to understand the people and processes behind

    the products - building trust through transparency and human connection.

    '
  # 2026-09-17: this angle asked for the invention it got. Rewritten to
  # request the mechanism, never a narrative or a figure we cannot show.
  angle: 'Write from the shop-floor perspective about how this work is actually done: what incoming inspection checks, why lubrication intervals differ by climate, what packaging prevents in transit. Speak as a company that does this every day. Do NOT invent a trip, a client, a colleague or a week such as "Last week I visited a client in Germany", and attach no figure that is not a published standard or shown arithmetic. The interest comes from the process being real, not from a story being told.'
  proof_points:
  - 'The failure patterns that recur in returned bearings: contamination, misalignment, over-greasing, and what each one leaves behind'
  - 'Why lubrication intervals shorten in hot, humid climates, and how a maintenance schedule should change for them'
  - 'What incoming bearing inspection actually checks - dimensional, hardness, noise and clearance - and why each one matters'
  - 'What really determines delivery lead time on a non-standard bearing, and which steps can be compressed'
  - 'Condensation inside shipping containers: how micro-corrosion forms in transit, and what packaging prevents it'
  - 'Custom cage geometry: when a standard cage limits an application, and what changes when geometry is matched to the load'
  ctas:
  - What would you want to see from inside our operations? Tell us in the comments
  - Questions for our engineering team? We read every message
  hashtags:
  - '#Manufacturing'
  - '#QualityControl'
  - '#Bearings'
  image_prompt: 'Authentic workshop scene with engineer examining bearing with precision instruments,

    warm industrial lighting, workbench with tools and technical drawings visible,

    conveying expertise and craftsmanship.

    '
- name: 'Product Spotlight: TNT Motion Catalogues'
  # CATALOGUES ONLY (user 2026-09-29): the spotlight shows what is in TNT's two published
  # catalogues - the CNC Tooling Catalogue (current build, static/catalogues/build/strings_en.py,
  # TNTMotion repo) and the bearings General Catalogue v1.4.2 (static/catalogues/
  # TNT-Motion-General-Catalogue-v1.4.2.pdf). Every proof point is quoted from one of them, so a
  # post MAY cite these figures. Removed: rivet nuts (never sold; 拉钉 is a pull stud) and high-
  # temperature bearing products. HYBRID BEARINGS stay (user 2026-09-29: "we can keep", to be added
  # to the catalogue in a later session) - quoted with material properties only, no performance figure. Turbines: their main
  # shafts often run on hydrostatic / hydrodynamic bearings, but a turbine holds many ROLLING
  # bearings too (gearboxes, rotors, auxiliaries) - those TNT supplies; the catalogue lists wind-
  # turbine uses for tapered, spherical and cylindrical roller bearings.
  # A runout figure is only half a spec without where it is measured: always "at 4×D",
  # "at 3× diameter" or "at gauge length", exactly as the catalogue states it.
  proof_points_are_specs: true
  # Evergreen by nature: a product explainer has no news hook by nature.
  use_news_search: false
  news_queries:
  - CNC toolholding industry
  - machine tool accessories market
  target_client: >
    CNC machining centre operators, toolroom managers, maintenance and design engineers, OEM
    procurement teams and distributors who specify toolholding and bearings.
  angle: >
    Showcase one product family from TNT Motion's two catalogues per post, rotating across the CNC
    Tooling Catalogue (CNC toolholders BT/CAT/HSK/ISO, hydraulic chucks, shrink-fit holders, ER collets,
    EOC collets, tapping collets, ER clamping nuts, collet chuck adapters) and the bearings General
    Catalogue (deep groove ball, tapered roller, spherical roller, cylindrical roller, Y-bearings,
    needle roller bearings, precision classes, noise and vibration grades), plus hybrid bearings. Name the product family in
    the headline, state one clear specification taken from the proof points below, then explain the
    mechanism: why an engineer chooses it over the alternative. Quote only the figures written in the
    proof points, and every runout figure together with where it is measured (for example
    "runout ≤ 0.005 mm at 4×D"), never on its own. Write what the catalogue specifies, not promises:
    no "guarantee", no "our engineers design", no customer stories.
  proof_points:
  - 'CNC toolholders — BT (JIS B6339) BT30, BT40, BT50; CAT (ANSI B5.50) CAT40, CAT50; HSK (ISO 12164)
    HSK-A32 to A100; ISO (7388-1) ISO30, ISO40, ISO50: precision-ground taper, radial runout ≤ 0.003 mm
    at gauge length, balanced to G2.5 at 25,000 RPM as standard'
  - 'Hydraulic chucks: oil pressurised in an annular chamber grips the shank with uniform 360° contact
    over the full clamping length — radial runout ≤ 0.003 mm at 3× diameter, tightened with one Allen
    screw, no collets and no heating; shank tolerance h6, reducer sleeves down to Ø 3 mm'
  - 'Shrink-fit holders: induction heating to 250–300 °C expands the bore, cooling creates a solid
    interference fit — no moving parts, maximum rigidity, and a slim holder that reaches deep pockets'
  - 'ER collets (DIN 6499 / ISO 15488), ER8 to ER50: runout ≤ 0.008 mm standard grade and ≤ 0.005 mm
    HP grade, both measured at 4×D; 1 mm clamping range per collet on standard sizes'
  - 'EOC collets (DIN 6388 / ISO 10897), EOC 6 to EOC 40: a shallow 2.52° cone angle for concentricity
    and rigidity under high axial loads'
  - 'Tapping collets GT12, GT24, GT42 (JIS B4302), 65Mn spring steel: the rigid version drives the tap
    directly for CNC rigid tapping with zero axial float; the torque-limiting clutch version slips at a
    preset torque so the tap does not break when it bottoms out in a blind hole'
  - 'ER clamping nuts: high-precision nut for the lowest runout; ball-bearing nut reduces tool pull-out; balanced
    nut for high-speed spindles; torque wrenches for repeatable clamping'
  - 'Collet chuck adapters, straight shank and Morse taper, ER16 to ER40: ER clamping on drill presses,
    conventional mills and lathes without a CNC toolholder'
  # --- bearings General Catalogue v1.4.2 ---
  - 'Deep groove ball bearings: bore 1 mm to 145 mm, outer diameter 3 mm to 240 mm; radial and axial
    loads in both directions; cages in steel, brass or plastic; open, shielded or sealed; used in electric
    motors and generators, wheel hubs, transmissions and alternators'
  - 'Tapered roller bearings: combined radial load and axial load in one direction, with clearance and
    preload set at assembly; used in vehicle axles, gearboxes and differentials, railcar axles, and wind
    turbine gearboxes and rotors'
  - 'Spherical roller bearings: self-aligning - they accommodate angular misalignment and shaft
    deflection while carrying heavy radial loads and axial loads in both directions; conical-bore versions
    mount with adapter or withdrawal sleeves; used in mining crushers and screens, paper-mill rolls and
    wind turbines'
  - 'Cylindrical roller bearings NU, NUP and NJ: high radial load capacity from the large roller-raceway
    contact; NUP and NJ also locate the shaft axially; multi-row types support the radial loads in wind
    turbine gearboxes'
  - 'Y-bearings YAR (set screw), YEL (eccentric collar) and YAT (grub screw): convex outer ring in a
    concave housing makes them self-aligning; pre-lubricated and sealed for low maintenance'
  - 'Hybrid bearings: silicon nitride (Si3N4) ceramic balls on steel races - silicon nitride weighs
    3.2 g/cm³ against 7.8 g/cm³ for bearing steel (about 60% lighter) and does not conduct electricity,
    which stops current passing through the bearing in e-motors and inverter-driven motors'
  - 'Needle roller bearings: high load capacity in a small radial cross-section, from the large contact
    area of the needles on the raceway'
  - 'Bearing precision classes to ISO 492 (bore 0 to 18 mm), radial runout of the ring: P0 ≤ 15 µm,
    P6 ≤ 10 µm, P5 ≤ 7 µm, P4 ≤ 4 µm, P2 ≤ 2 µm'
  - 'Noise and vibration grades: Z1 to Z3 for noise and V1 to V3 for vibration; Z3V3 is the
    high-precision grade, for quiet electric motors and precision equipment'
  ctas:
  - Request our CNC Tooling Catalogue or our bearings General Catalogue — DM or email info@tntbearings.com
  - Tell us your spindle taper and the tools you run, and we will match the holder
  - Tag a toolroom engineer who specifies their own toolholding
